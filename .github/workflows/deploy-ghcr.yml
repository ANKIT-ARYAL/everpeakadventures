name: Build and Push to GHCR

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    # 1. PERMISSIONS: We have to explicitly allow the robot to write to our packages
    permissions:
      contents: read
      packages: write

    steps:
      # Step A: Download your code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step B: Log into GHCR using GitHub's built-in magic token
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step C: Format the name correctly (Docker requires all lowercase letters)
      - name: Set up Docker image name
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      # Step D: Build and push the image to GHCR
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Step E: Delete old versions
      - name: Delete old packages
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PACKAGE_NAME: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "Fetching versions for container package $PACKAGE_NAME..."
          # Get all version IDs except the single most recent one
          VERSION_IDS=$(gh api -H "Accept: application/vnd.github+json" /users/$OWNER/packages/container/$PACKAGE_NAME/versions --jq '.[1:] | .[].id' || echo "")
          
          if [ -z "$VERSION_IDS" ]; then
            echo "No old versions to delete!"
          else
            for ID in $VERSION_IDS; do
              echo "Deleting version ID: $ID"
              gh api -X DELETE -H "Accept: application/vnd.github+json" /users/$OWNER/packages/container/$PACKAGE_NAME/versions/$ID || true
            done
          fi